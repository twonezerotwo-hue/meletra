[pytest]
pythonpath = .
testpaths = tests
# Keep pytest's temp files inside the project: avoids permission problems in %TEMP% on some Windows setups.
addopts = -ra --basetemp=.pytest_tmp -p no:cacheprovider
markers =
    ffmpeg: needs a real FFmpeg binary (skipped automatically when it is missing)
    gpu: needs a CUDA GPU (never part of the default suite)
    windows_platform: asserts the Windows branch of the code; on other systems it runs with the Windows platform object
    windows_only: calls real Windows APIs (skipped on macOS / Linux; the macOS behaviour is tested with a fake Mac)
